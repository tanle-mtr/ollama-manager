<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <!-- 外圈渐变 -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    
    <!-- 头部渐变 -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 眼睛发光 -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.8" />
    </radialGradient>
    
    <!-- 天线球渐变 -->
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- 外圈光环 -->
  <circle cx="128" cy="128" r="95" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.8"/>
  
  <!-- 内圈光晕 -->
  <circle cx="128" cy="128" r="70" fill="url(#ringGrad)" opacity="0.1"/>
  
  <!-- 机器人头部 -->
  <rect x="88" y="85" width="80" height="70" rx="16" ry="16" fill="url(#headGrad)" filter="url(#shadow)"/>
  
  <!-- 左眼 -->
  <circle cx="108" cy="115" r="10" fill="url(#eyeGlow)" filter="url(#glow)"/>
  <circle cx="108" cy="115" r="4" fill="#ffffff" opacity="0.8"/>
  
  <!-- 右眼 -->
  <circle cx="148" cy="115" r="10" fill="url(#eyeGlow)" filter="url(#glow)"/>
  <circle cx="148" cy="115" r="4" fill="#ffffff" opacity="0.8"/>
  
  <!-- 天线杆 -->
  <rect x="124" y="60" width="8" height="25" rx="4" ry="4" fill="#94a3b8"/>
  
  <!-- 天线球 -->
  <circle cx="128" cy="52" r="10" fill="url(#ballGrad)" filter="url(#glow)"/>
  
  <!-- 底座 -->
  <rect x="100" y="155" width="56" height="12" rx="4" ry="4" fill="#64748b"/>
  
  <!-- 装饰线条 -->
  <line x1="95" y1="135" x2="161" y2="135" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 高光 -->
  <ellipse cx="105" cy="95" rx="12" ry="6" fill="#ffffff" opacity="0.15"/>
</svg>
