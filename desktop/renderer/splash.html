<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ollama Manager Desktop</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loading-screen {
      text-align: center;
    }
    .loading-screen i {
      font-size: 48px;
      background: linear-gradient(135deg, #58a6ff 0%, #a371f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
    .loading-screen p {
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="loading-screen">
    <i class="fas fa-robot"></i>
    <h2>Ollama Manager</h2>
    <p>正在启动...</p>
  </div>
</body>
</html>
